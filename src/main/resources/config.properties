# SauceDemo Test Framework Configuration

# Application Base URL
base.url=https://www.saucedemo.com

# Browser Configuration (comma-separated for multiple browsers)
browser=chromium,firefox,webkit
headless=true
slowmo=0

# Viewport Configuration
viewport.width=1920
viewport.height=1080

# Timeout Configuration (milliseconds)
timeout.default=30000
timeout.element=10000
timeout.script=30000
timeout.navigation=30000

# Screenshot Configuration
screenshot.on.failure=true
screenshot.base64=true

# Extent Report Configuration
report.title=SauceDemo Automation Test Report
report.theme=standard
report.encoding=UTF-8

# Author & Categories
report.author=Automation Team
report.category=Regression
report.category=Smoke
report.category=Sanity
report.category=E2E

# Parallel Execution Configuration
parallel.methods=true
thread.count=4
dataprovider.thread.count=1

# Test Data Configuration
default.username=standard_user
default.password=secret_sauce